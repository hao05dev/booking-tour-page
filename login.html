<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập Tài Khoản - BookingTour</title>
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Stylesheet -->
    <!-- Modular Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <!-- Site Header (Clean Minimal) -->
  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="navbar-brand">
        <i class="fa-solid fa-compass"></i>
        <span>BookingTour</span>
      </a>

      <div class="nav-actions">
        <span class="text-muted" style="font-size: 0.9rem;">Chưa có tài khoản?</span>
        <a href="register.html" class="btn btn-outline btn-sm">Đăng Ký</a>
      </div>
    </div>
  </header>

  <!-- Auth Wrapper -->
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div style="width: 56px; height: 56px; border-radius: 50%; background-color: var(--primary-100); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 16px;">
          <i class="fa-solid fa-arrow-right-to-bracket"></i>
        </div>
        <h1 class="auth-title">Chào Mừng Trở Lại</h1>
        <p class="auth-subtitle">Đăng nhập để quản lý lịch trình và nhận ưu đãi riêng của bạn</p>
      </div>

      <form id="loginForm">
        <!-- Email Input -->
        <div class="form-group">
          <label class="form-label required" for="email">Email</label>
          <div class="input-icon-wrapper">
            <i class="fa-regular fa-envelope icon-left"></i>
            <input type="email" id="email" class="form-control has-icon-left" placeholder="Nhập địa chỉ email của bạn..." required>
          </div>
          <div class="invalid-feedback" id="emailError">Vui lòng nhập địa chỉ email hợp lệ.</div>
        </div>

        <!-- Password Input -->
        <div class="form-group">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <label class="form-label required" for="password" style="margin-bottom:0;">Mật khẩu</label>
            <a href="#" onclick="showToast('Chức năng quên mật khẩu: Vui lòng kiểm tra email reset', 'info')" style="font-size:0.8rem; color:var(--primary); font-weight:600;">Quên mật khẩu?</a>
          </div>
          <div class="input-icon-wrapper">
            <i class="fa-solid fa-lock icon-left"></i>
            <input type="password" id="password" class="form-control has-icon-left has-icon-right" placeholder="••••••••" required>
            <i class="fa-regular fa-eye icon-right" id="togglePassword" onclick="togglePasswordVisibility('password', this)"></i>
          </div>
          <div class="invalid-feedback" id="passwordError">Mật khẩu phải có ít nhất 6 ký tự.</div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
          <label class="form-check">
            <input type="checkbox" checked>
            <span>Ghi nhớ đăng nhập</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Đăng Nhập
        </button>
      </form>

      <div style="text-align:center; margin-top:24px; font-size:0.9rem; color:var(--text-muted);">
        Chưa có tài khoản? <a href="register.html" style="color:var(--primary); font-weight:700;">Tạo tài khoản mới</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/mock-data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/tours.js"></script>
  <script src="js/booking.js"></script>
  <script src="js/dashboards.js"></script>
  <script src="js/main.js"></script>
  <script>
    function togglePasswordVisibility(inputId, iconEl) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        iconEl.className = 'fa-regular fa-eye-slash icon-right';
      } else {
        input.type = 'password';
        iconEl.className = 'fa-regular fa-eye icon-right';
      }
    }
  </script>
</body>
</html>
